[package]
name = "map_tests"
version = "0.1.0"
description = "Procedural world-map preview"
authors = ["you"]
edition = "2021"

[lib]
name = "map_tests"
path = "src/lib.rs"

[[bin]]
name = "map_tests"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
noise = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
tiny-skia = "0.11"
